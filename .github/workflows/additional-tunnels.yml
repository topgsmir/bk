name: Additional tunnels
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build optional manager and run validation tests
        run: |
          go build -o "$RUNNER_TEMP/bk-addons" .
          go test ./internal/externaltunnel -race -timeout 3m
      - name: Install test dependencies and pinned upstream cores
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping iptables obfs4proxy libpcap-dev openssh-server build-essential curl
          for kind in rgt-tcp paqet alghadir awg; do
            sudo env PATH="$PATH" "$RUNNER_TEMP/bk-addons" external install --kind "$kind"
          done
          sudo modprobe l2tp_eth
          sudo modprobe l2tp_ip
          sudo modprobe l2tp_netlink
      - name: Real two-server tests and cleanup (all additional methods)
        run: |
          sudo env PATH="$PATH" BK_LIVE_ADDONS=1 BK_ADDON_BINARY="$RUNNER_TEMP/bk-addons" go test ./internal/manage -run '^TestAdditionalTunnelsAcrossNamespaces$' -count=1 -v -timeout 10m
      - name: Real upstream RGT TCP and UDP regression
        run: |
          sudo env PATH="$PATH" BK_LIVE_RGT=1 BK_ADDON_BINARY="$RUNNER_TEMP/bk-addons" go test ./internal/manage -run '^TestAdditionalRGTOverLoopback$' -count=1 -v -timeout 3m
